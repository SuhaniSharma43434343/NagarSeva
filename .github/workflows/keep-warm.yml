name: Optional daytime wake-up
on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
permissions:
  contents: read
concurrency:
  group: keep-warm
  cancel-in-progress: false
jobs:
  probe:
    if: vars.KEEP_WARM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/keep_warm.py
        env:
          KEEP_WARM_URLS: ${{ vars.KEEP_WARM_URLS }}
          WAKE_TIMEZONE: ${{ vars.WAKE_TIMEZONE }}
          WAKE_START_HOUR: ${{ vars.WAKE_START_HOUR }}
          WAKE_END_HOUR: ${{ vars.WAKE_END_HOUR }}
